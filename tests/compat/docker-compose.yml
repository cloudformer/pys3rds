# Real databases for the compatibility tests.
#   docker compose -f tests/compat/docker-compose.yml up -d
#   MYSQL_DSN=mysql://root:test@127.0.0.1:3306/compat python3 -m pytest tests/compat -v
name: s3rds-compat   # unique per project, so the series' compat containers never mix
services:
  mysql:
    image: mysql:8.0.46
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: compat
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptest"]
      interval: 5s
      retries: 20
  postgres:                      # for s3rds.psycopg2, once it exists
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: compat
    ports: ["5433:5432"]   # 5433: 5432 is often taken by a local PostgreSQL
