[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s3rds"
version = "0.1.0"
description = "A truly serverless RDS on your own AWS account: Lambda URL endpoint, SQLite on S3, ≈ $0 when idle. Drivers named after the standard clients: s3rds.sqlite, s3rds.pymysql."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Frank Zhang" }]
keywords = ["serverless", "rds", "sqlite", "s3", "lambda", "database", "pymysql", "dbapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Database :: Front-Ends",
]
dependencies = []  # standard library only

[project.optional-dependencies]
mysql = ["sqlglot>=25.0"]  # s3rds.pymysql: MySQL -> SQLite dialect translation

[project.urls]
Homepage = "https://github.com/cloudformer/s3rds"

[tool.setuptools]
packages = ["s3rds"]
