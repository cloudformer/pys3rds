<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="lambda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F58534"/><stop offset="1" stop-color="#C7511F"/>
    </linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6CAE3E"/><stop offset="1" stop-color="#3F8624"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A6B82"/><stop offset="1" stop-color="#232F3E"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="980" height="460" rx="16" fill="#F8FAFC"/>

  <!-- ===== clients ===== -->
  <rect x="24" y="40" width="250" height="380" rx="10" fill="none" stroke="#94A3B8" stroke-dasharray="6 5"/>
  <text x="149" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">Clients</text>

  <!-- browser -->
  <rect x="94" y="96" width="110" height="78" rx="8" fill="url(#client)"/>
  <rect x="104" y="108" width="90" height="10" rx="3" fill="#CBD5E1"/>
  <circle cx="110" cy="113" r="2.5" fill="#F87171"/><circle cx="118" cy="113" r="2.5" fill="#FBBF24"/><circle cx="126" cy="113" r="2.5" fill="#34D399"/>
  <rect x="104" y="124" width="90" height="40" rx="3" fill="#E2E8F0"/>
  <rect x="110" y="130" width="40" height="5" rx="2" fill="#94A3B8"/><rect x="110" y="140" width="78" height="5" rx="2" fill="#CBD5E1"/><rect x="110" y="150" width="60" height="5" rx="2" fill="#CBD5E1"/>
  <text x="149" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#232F3E">Web console</text>
  <text x="149" y="212" text-anchor="middle" font-size="11" fill="#64748B">browse · edit · SQL</text>

  <!-- your app -->
  <rect x="94" y="262" width="110" height="78" rx="8" fill="url(#client)"/>
  <text x="149" y="296" text-anchor="middle" font-size="12" fill="#FFFFFF">import</text>
  <text x="149" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">pys3mysql</text>
  <text x="149" y="362" text-anchor="middle" font-size="13" font-weight="600" fill="#232F3E">Your application</text>
  <text x="149" y="378" text-anchor="middle" font-size="11" fill="#64748B">Lambda · ECS · EC2 · laptop</text>
  <text x="149" y="392" text-anchor="middle" font-size="11" fill="#64748B">pymysql-shaped driver</text>

  <!-- ===== your AWS account ===== -->
  <rect x="320" y="40" width="636" height="380" rx="10" fill="none" stroke="#94A3B8"/>
  <text x="638" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">pys3rds · your AWS account · ≈ $0 when idle</text>

  <!-- db lambda (rw) -->
  <rect x="420" y="96" width="96" height="96" rx="10" fill="url(#lambda)"/>
  <text x="468" y="162" text-anchor="middle" font-size="54" font-weight="700" fill="#FFFFFF">λ</text>
  <text x="468" y="214" text-anchor="middle" font-size="13" font-weight="600" fill="#232F3E">db lambda</text>
  <text x="468" y="230" text-anchor="middle" font-size="11" fill="#64748B">Function URL = DB endpoint</text>
  <text x="468" y="244" text-anchor="middle" font-size="11" fill="#64748B">single writer · serves console</text>

  <!-- db-ro lambda -->
  <rect x="420" y="276" width="96" height="96" rx="10" fill="url(#lambda)"/>
  <text x="468" y="342" text-anchor="middle" font-size="54" font-weight="700" fill="#FFFFFF">λ</text>
  <text x="468" y="394" text-anchor="middle" font-size="13" font-weight="600" fill="#232F3E">db-ro lambda</text>
  <text x="468" y="410" text-anchor="middle" font-size="11" fill="#64748B">read-only · unlimited concurrency</text>

  <!-- S3 -->
  <rect x="760" y="186" width="96" height="96" rx="10" fill="url(#s3)"/>
  <path d="M784 212 q24 -10 48 0 v38 q-24 12 -48 0 z" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
  <ellipse cx="808" cy="212" rx="24" ry="6" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
  <text x="808" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#232F3E">S3 bucket</text>
  <text x="808" y="320" text-anchor="middle" font-size="11" fill="#64748B">db/&lt;name&gt;.sqlite</text>
  <text x="808" y="334" text-anchor="middle" font-size="11" fill="#64748B">one file = one database</text>

  <!-- ===== arrows ===== -->
  <!-- console -> db lambda -->
  <path d="M204 135 C 300 135, 330 144, 418 144" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- app -> db lambda (writes) -->
  <path d="M204 290 C 300 290, 320 160, 418 160" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- app -> db-ro (reads) -->
  <path d="M204 312 C 300 312, 330 324, 418 324" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="312" y="124" text-anchor="middle" font-size="11" fill="#475569">HTTPS · Basic auth</text>
  <text x="312" y="346" text-anchor="middle" font-size="11" fill="#475569">reads scale out</text>

  <!-- db lambda -> S3 -->
  <path d="M516 150 C 640 150, 660 222, 758 222" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="636" y="140" text-anchor="middle" font-size="11" fill="#475569">GET if ETag changed</text>
  <text x="636" y="154" text-anchor="middle" font-size="11" fill="#475569">PUT If-Match (CAS), only if data changed</text>
  <!-- db-ro -> S3 -->
  <path d="M516 320 C 640 320, 660 250, 758 250" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="636" y="312" text-anchor="middle" font-size="11" fill="#475569">GET if ETag changed</text>

  <!-- footnote -->
  <text x="638" y="406" text-anchor="middle" font-size="11" fill="#64748B">/tmp cache keyed by ETag · explicit transactions, DDL included · STRICT tables · foreign keys on · nothing runs between requests</text>
</svg>
