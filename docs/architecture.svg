<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480"
     font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#232F3E">
  <defs>
    <linearGradient id="gLambda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7981D"/><stop offset="1" stop-color="#D45B07"/>
    </linearGradient>
    <linearGradient id="gS3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7AA116"/><stop offset="1" stop-color="#3F8624"/>
    </linearGradient>
    <linearGradient id="gUI" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8C4FFF"/><stop offset="1" stop-color="#5B3BC8"/>
    </linearGradient>
    <linearGradient id="gClient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B5B73"/><stop offset="1" stop-color="#232F3E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font-size: 16px; font-weight: 700; }
      .sub   { font-size: 11.5px; fill: #64748B; }
      .label { font-size: 13px; font-weight: 600; }
      .note  { font-size: 11px; fill: #475569; }
      .edge  { fill: none; stroke: #334155; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="1000" height="480" rx="18" fill="#F8FAFC"/>

  <!-- ============ the RDS box ============ -->
  <rect x="330" y="34" width="640" height="412" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="64" text-anchor="middle" class="title">pys3rds — your RDS</text>
  <text x="650" y="82" text-anchor="middle" class="sub">a Lambda URL as the endpoint · SQLite files on S3 · ≈ $0 when idle</text>

  <!-- Web console -->
  <g transform="translate(400,110)">
    <rect width="96" height="96" rx="12" fill="url(#gUI)" filter="url(#shadow)"/>
    <rect x="14" y="18" width="68" height="8" rx="2" fill="#FFFFFF" opacity="0.95"/>
    <rect x="14" y="32" width="68" height="46" rx="3" fill="#FFFFFF" opacity="0.22"/>
    <rect x="20" y="38" width="56" height="5" rx="2" fill="#FFFFFF"/>
    <rect x="20" y="48" width="56" height="5" rx="2" fill="#FFFFFF" opacity="0.7"/>
    <rect x="20" y="58" width="56" height="5" rx="2" fill="#FFFFFF" opacity="0.7"/>
    <rect x="20" y="68" width="34" height="5" rx="2" fill="#FFFFFF" opacity="0.7"/>
    <text x="48" y="118" text-anchor="middle" class="label">Web console</text>
    <text x="48" y="134" text-anchor="middle" class="sub">databases · tables · rows · SQL</text>
  </g>

  <!-- Endpoint -->
  <g transform="translate(400,300)">
    <rect width="96" height="96" rx="12" fill="url(#gLambda)" filter="url(#shadow)"/>
    <text x="48" y="68" text-anchor="middle" font-size="56" font-weight="700" fill="#FFFFFF">λ</text>
    <text x="48" y="118" text-anchor="middle" class="label">Endpoint</text>
    <text x="48" y="134" text-anchor="middle" class="sub">Lambda URL · SQL engine · user / password</text>
  </g>

  <!-- S3 -->
  <g transform="translate(830,205)">
    <rect width="96" height="96" rx="12" fill="url(#gS3)" filter="url(#shadow)"/>
    <path d="M24 28 q24 -11 48 0 v38 q-24 13 -48 0 z" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
    <ellipse cx="48" cy="28" rx="24" ry="6.5" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
    <text x="48" y="118" text-anchor="middle" class="label">S3</text>
    <text x="48" y="134" text-anchor="middle" class="sub">db/blog.sqlite · db/shop.sqlite · …</text>
    <text x="48" y="148" text-anchor="middle" class="sub">one file = one database</text>
  </g>

  <!-- console -> endpoint -->
  <path d="M448 208 L 448 298" class="edge" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="458" y="258" class="note">same HTTP API</text>

  <!-- endpoint <-> S3 -->
  <path d="M496 336 C 660 336, 680 253, 828 253" class="edge" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="662" y="286" text-anchor="middle" class="note">read: GET only when the ETag changed (/tmp cache)</text>
  <text x="662" y="301" text-anchor="middle" class="note">write: PUT with If-Match, only when data changed</text>

  <text x="650" y="430" text-anchor="middle" class="sub">explicit transactions (DDL included) · STRICT tables · foreign keys on · single writer · nothing runs between requests</text>

  <!-- ============ outside: browser ============ -->
  <g transform="translate(70,96)">
    <rect width="120" height="84" rx="10" fill="url(#gClient)" filter="url(#shadow)"/>
    <rect x="10" y="12" width="100" height="12" rx="3" fill="#CBD5E1"/>
    <circle cx="17" cy="18" r="2.6" fill="#F87171"/><circle cx="25" cy="18" r="2.6" fill="#FBBF24"/><circle cx="33" cy="18" r="2.6" fill="#34D399"/>
    <rect x="10" y="30" width="100" height="44" rx="3" fill="#E2E8F0"/>
    <rect x="16" y="37" width="44" height="5" rx="2" fill="#94A3B8"/>
    <rect x="16" y="47" width="86" height="5" rx="2" fill="#CBD5E1"/>
    <rect x="16" y="57" width="66" height="5" rx="2" fill="#CBD5E1"/>
    <text x="60" y="108" text-anchor="middle" class="label">Browser</text>
    <text x="60" y="124" text-anchor="middle" class="sub">you, looking at the data</text>
  </g>
  <path d="M190 138 L 398 158" class="edge" marker-end="url(#arrow)"/>
  <text x="292" y="136" text-anchor="middle" class="note">HTTPS</text>

  <!-- ============ outside: your application ============ -->
  <g transform="translate(70,290)">
    <rect width="120" height="84" rx="10" fill="url(#gClient)" filter="url(#shadow)"/>
    <text x="60" y="34" text-anchor="middle" font-size="11.5" fill="#94A3B8" text-decoration="line-through">import pymysql</text>
    <text x="60" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">import pys3mysql</text>
    <text x="60" y="108" text-anchor="middle" class="label">Your application</text>
    <text x="60" y="124" text-anchor="middle" class="sub">EC2 · Lambda · ECS · laptop</text>
    <text x="60" y="139" text-anchor="middle" class="sub">the only change is one import line</text>
  </g>
  <path d="M190 332 L 398 346" class="edge" marker-end="url(#arrow)"/>
  <text x="292" y="326" text-anchor="middle" class="note">HTTPS · user / password</text>
  <text x="292" y="366" text-anchor="middle" class="note">exactly like connecting to RDS</text>
</svg>
